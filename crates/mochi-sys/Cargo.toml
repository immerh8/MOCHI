[package]
name = "mochi-sys"
description = "The Win32 calls MOCHI needs and mochi-core cannot make (it forbids unsafe): a write-through, no-replace move, a volume filesystem name, and a one-byte file lock. Windows only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Empty on every other platform: the whole library is `#![cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
