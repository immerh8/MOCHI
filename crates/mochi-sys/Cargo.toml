[package]
name = "mochi-sys"
description = "The two Win32 calls MOCHI needs and mochi-core cannot make (it forbids unsafe): a write-through, no-replace move and a volume filesystem name. Windows only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Empty on every other platform: the whole library is `#![cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
