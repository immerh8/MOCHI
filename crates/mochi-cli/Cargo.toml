[package]
name = "mochi-cli"
description = "The `mochi` command-line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mochi_cli"
path = "src/lib.rs"

[[bin]]
name = "mochi"
path = "src/main.rs"

[dependencies]
mochi-core.workspace = true
mochi-format.workspace = true
clap.workspace = true
serde_json.workspace = true
rpassword.workspace = true
zeroize.workspace = true

[dev-dependencies]
mochi-testkit.workspace = true
tempfile.workspace = true
blake3.workspace = true
# R7 (gate G15): validates the CLI's JSON outputs against docs/schemas/json/.
# MIT; test-only, never a dependency of the shipped binary. No default
# features: no HTTP or file retrieval (the test registers every schema itself).
jsonschema = { version = "0.58", default-features = false }

[lints]
workspace = true
