[package]
name = "mochi-shellext"
description = "The Windows Explorer context-menu handler (classic IContextMenu, in-process COM DLL): \"Add to archive...\" and a dynamic Add to \"<Name>.mochi\". Empty on every other platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the shell extension; rlib lets `cargo test` run the pure logic (`plan`) anywhere.
crate-type = ["cdylib", "rlib"]

# Empty on every other platform: the COM code is `#[cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
