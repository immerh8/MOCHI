# License policy for what the desktop installers ship (plan D7, O23).
#
# `cargo about` fails the build on any crate in the shipped graph whose license
# is not in `accepted`; packaging/licenses.py applies the same list to the npm
# packages in the UI bundle. Adding an entry is a policy decision (O23: new
# dependencies must be MIT/Apache-2.0-compatible): say why in the commit.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    # libbz2-rs-sys (bzip2 decoding for 7z, D8): the bzip2 license is a BSD-style
    # permissive license with no copyleft, compatible with MIT OR Apache-2.0.
    "bzip2-1.0.6",
    "MIT-0",
    # MPL-2.0 is file-level copyleft; shipping the crates unmodified is
    # compatible with MIT OR Apache-2.0. Present in Tauri's dependency tree.
    # Owner to confirm (docs/packaging.md "Open question").
    "MPL-2.0",
]

# Only what ships: the Windows and Ubuntu x86-64 builds of the app (O11), not
# dev- or build-dependencies.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The workspace's own crates (publish = false) are MOCHI itself, covered by
# LICENSE-MIT / LICENSE-APACHE, which licenses.py prepends.
private = { ignore = true }
