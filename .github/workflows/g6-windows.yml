name: g6-windows

# TEMPORARY probe (G6b step 1). Replaced by the real workflow once KVM and the
# evaluation media are confirmed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/g6-windows.yml
      - ci/g6-windows-crashreplay.sh

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Host
        run: |
          uname -r; nproc; free -g; df -h /; lscpu | grep -i -E 'model name|virtualization|hypervisor'
          ls -l /dev/kvm || echo "no /dev/kvm"
      - name: Enable KVM via udev
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "still no /dev/kvm"
          test -w /dev/kvm && echo "KVM USABLE" || echo "KVM NOT USABLE"
      - name: QEMU, OVMF, swtpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools libdevmapper-dev dmsetup build-essential git
          qemu-system-x86_64 --version; swtpm --version
          ls /usr/share/OVMF/ /usr/share/ovmf 2>&1 | head -30
      - name: Build replay-log (xfstests src/log-writes)
        run: |
          sudo modprobe dm-log-writes && echo "dm-log-writes loaded"
          git clone --depth 1 https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git /tmp/xfstests || git clone --depth 1 https://github.com/kdave/xfstests /tmp/xfstests
          git -C /tmp/xfstests rev-parse HEAD
          ls /tmp/xfstests/src/log-writes
          cd /tmp/xfstests/src/log-writes && gcc -O2 -D_FILE_OFFSET_BITS=64 -D_LARGEFILE64_SOURCE -I. -o replay-log replay-log.c log-writes.c -ldevmapper 2>&1 | tail -20
          ls -l /tmp/xfstests/src/log-writes/replay-log
      - name: Microsoft evaluation media reachability
        run: |
          for id in 2382600 2289029; do
            echo "== linkid=$id"
            curl -sIL -m 30 "https://go.microsoft.com/fwlink/?linkid=$id&clcid=0x409&culture=en-us&country=us" | grep -i -E '^(HTTP|location|content-length|content-disposition)' | head -8
          done
          echo "== windows 10 eval page"
          curl -sI -m 30 https://www.microsoft.com/en-us/evalcenter/download-windows-10-enterprise | grep -i -E '^(HTTP|location)'
