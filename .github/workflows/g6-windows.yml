name: g6-windows

# Gate G6 (spec Annex B.2.6, G6: Windows durability), hardware-free: block-level
# crash replay of real Windows client builds (Windows 11 and Windows 10 22H2
# Enterprise evaluation media) in QEMU/KVM VMs, the CrashMonkey / dm-log-writes
# method. Method, limits and evidence:
# docs/g6-windows-crash-replay.md. Counterpart of the `powercut` job in ci.yml
# (G7, Linux).
#
# Slow (about 45 minutes per guest OS, the OSes in parallel), so it never runs on
# pull requests; it runs on demand and weekly.
#
#   gh workflow run g6-windows.yml -f ref=<branch or sha under test>
#
# `ref` is the code whose Windows storage code is tested (for example a branch
# under review); `baseline_ref` is the reference run (default: main just before
# G6a, 9b3a3a7, the link-then-unlink publication). The harness itself (this
# workflow, ci/g6-windows*, and the g6_winworkload example) always comes from the
# commit the workflow runs at and is overlaid on the tested tree, so a ref older
# than the harness can be tested too.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref whose Windows storage code is tested (default: the commit this workflow runs at)"
        required: false
        default: ""
      baseline_ref:
        description: "Reference run for comparison (empty: skip). Default: main just before G6a, the link-then-unlink publication"
        required: false
        default: "9b3a3a72eee51d7064ab290db98fd8ab641b7678"
      max_flush_points:
        description: "Upper bound on FLUSH/FUA replay points"
        required: false
        default: "72"
      between_points:
        description: "Replay points between flushes (unflushed writes dropped)"
        required: false
        default: "24"
      strict_creation:
        description: "Judge creation as durable even where acknowledged DirectoryUnconfirmed (does the name survive a crash right after the acknowledgement?). Applies to both runs; the baseline is expected to show the gap."
        type: boolean
        default: true
      windows_10:
        description: "Also run Windows 10 22H2 (evaluation ISO from Microsoft's download link, whose Evaluation Center page is retired)"
        type: boolean
        default: true
      image_only:
        description: "Build the Windows image, then stop"
        type: boolean
        default: false
  schedule:
    - cron: "41 3 * * 1"

concurrency:
  group: g6-windows-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      oses: ${{ steps.plan.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT: ${{ github.event_name }}
          INPUT_BASELINE: ${{ inputs.baseline_ref }}
          INPUT_WINDOWS_10: ${{ inputs.windows_10 }}
        run: |
          resolve() {
            git rev-parse --verify --quiet "origin/$1^{commit}" || git rev-parse --verify --quiet "$1^{commit}" || {
              echo "::error::cannot resolve ref '$1'"; exit 1; }
          }
          # Baseline: main as it was just before G6a (MoveFileExW write-through,
          # #61) switched Windows creation away from link-then-unlink. Only a
          # manual run can skip it (empty input).
          if [ "$EVENT" != workflow_dispatch ]; then INPUT_BASELINE=9b3a3a72eee51d7064ab290db98fd8ab641b7678; fi
          cand_ref=${INPUT_REF:-${GITHUB_SHA}}
          cand=$(resolve "$cand_ref")
          items="{\"label\":\"candidate\",\"ref\":\"$cand_ref\",\"sha\":\"$cand\"}"
          if [ -n "$INPUT_BASELINE" ]; then
            base=$(resolve "$INPUT_BASELINE")
            if [ "$base" != "$cand" ]; then
              items="$items,{\"label\":\"baseline\",\"ref\":\"$INPUT_BASELINE\",\"sha\":\"$base\"}"
            else
              echo "baseline is the same commit as the candidate; one run covers both"
            fi
          fi
          echo "matrix=[$items]" | tee -a "$GITHUB_OUTPUT"
          if [ "$INPUT_WINDOWS_10" = false ]; then oses='["windows-11"]'; else oses='["windows-11","windows-10"]'; fi
          echo "oses=$oses" | tee -a "$GITHUB_OUTPUT"

  build-windows:
    # The guest runs Windows client binaries built natively here. The harness
    # example is overlaid on the tested tree; crt-static so the VM needs no
    # Visual C++ redistributable.
    needs: plan
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: subject
      - name: Overlay the harness example on the tested tree
        shell: bash
        run: cp harness/crates/mochi-testkit/examples/g6_winworkload.rs subject/crates/mochi-testkit/examples/g6_winworkload.rs
      - name: Install pinned toolchain
        shell: bash
        working-directory: subject
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subject
          key: g6-${{ matrix.label }}
      - name: Build
        shell: bash
        working-directory: subject
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p mochi-cli --bin mochi
          cargo build --release --locked -p mochi-testkit --example g6_winworkload
          mkdir ../bins
          cp target/release/mochi.exe target/release/examples/g6_winworkload.exe ../bins/
          {
            echo "label=${{ matrix.label }} ref=${{ matrix.ref }} sha=${{ matrix.sha }}"
            echo "harness=$GITHUB_SHA"
            rustc -Vv | sed -n '1p;2p;5p'
          } | tee ../bins/BUILD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: g6-bins-${{ matrix.label }}
          path: bins/
          retention-days: 14

  replay:
    # One runner per guest OS, in parallel. Windows 10 22H2 (plan O11) comes from
    # the evaluation ISO Microsoft's own download link still serves; see
    # docs/g6-windows-crash-replay.md for its status.
    name: replay (${{ matrix.os }})
    needs: [plan, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
    env:
      G6_WORK: /var/tmp/g6
      G6_EVIDENCE: /var/tmp/g6/evidence
      G6_OS: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: g6-bins-*
          path: bins
      - name: Free disk space
        run: bash ci/g6-windows-crashreplay.sh free-disk
      - name: Host setup (KVM, QEMU, OVMF, swtpm, dm-log-writes, replay-log)
        run: bash ci/g6-windows-crashreplay.sh setup
      - name: Log reader self-test (against the real replay-log)
        run: bash ci/g6-windows-crashreplay.sh selftest
      - name: Resolve the Microsoft evaluation ISO
        run: bash ci/g6-windows-crashreplay.sh iso-info
      - name: Is any Windows 10 evaluation image still offered? (informational)
        if: matrix.os == 'windows-11'
        continue-on-error: true
        run: bash ci/g6-windows-crashreplay.sh win10-probe
      - name: Download the evaluation ISO
        run: bash ci/g6-windows-crashreplay.sh iso
      - name: Unattended Windows install
        # Not cached: the installed image archives to 12.2 GB, above the 10 GB
        # repository cache limit (measured, run 38685623011), and a cache that
        # size would evict the repository's other caches. A fresh install also
        # keeps the 90-day evaluation image young.
        run: bash ci/g6-windows-crashreplay.sh image
      - name: Crash replay, candidate
        id: candidate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_only) }}
        continue-on-error: true
        run: |
          bash ci/g6-windows-crashreplay.sh run candidate bins/g6-bins-candidate \
            --max-flush "${{ inputs.max_flush_points || '72' }}" --between "${{ inputs.between_points || '24' }}" \
            ${{ (github.event_name != 'workflow_dispatch' || inputs.strict_creation) && '--strict-creation' || '' }}
      - name: Crash replay, baseline
        id: baseline
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_only) && hashFiles('bins/g6-bins-baseline/**') != '' }}
        continue-on-error: true
        run: |
          bash ci/g6-windows-crashreplay.sh run baseline bins/g6-bins-baseline \
            --max-flush "${{ inputs.max_flush_points || '72' }}" --between "${{ inputs.between_points || '24' }}" \
            ${{ (github.event_name != 'workflow_dispatch' || inputs.strict_creation) && '--strict-creation' || '' }}
      - name: Crash replay, candidate with the directory flush suppressed (informational)
        # Isolates what the publication primitive alone makes durable: the real
        # OsDir, except that sync_directory flushes nothing. Expected to show the
        # gap where the primitive is not enough; its outcome never fails the job.
        id: nodirsync
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_only) }}
        continue-on-error: true
        run: |
          bash ci/g6-windows-crashreplay.sh run candidate-nodirsync bins/g6-bins-candidate \
            --workload-args=--no-dir-sync \
            --max-flush "${{ inputs.max_flush_points || '72' }}" --between "${{ inputs.between_points || '24' }}" \
            --strict-creation
      - name: Summary
        if: always()
        run: |
          sudo chmod -R a+rX /var/tmp/g6 || true
          echo "## ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          for l in candidate baseline candidate-nodirsync; do
            f=/var/tmp/g6/evidence/$l/summary.md
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          cat /var/tmp/g6/tools.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g6-evidence-${{ matrix.os }}
          path: |
            /var/tmp/g6/evidence
            /var/tmp/g6/evidence-image
            /var/tmp/g6/tools.json
            /var/tmp/g6/win.iso.json
            /var/tmp/g6/image/build-info.json
          if-no-files-found: warn
          retention-days: 90
      - name: Verdict
        # The candidate decides the job. The baseline is the reference run:
        # its outcome is reported in the summary and the evidence only.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_only) }}
        run: |
          echo "${{ matrix.os }}: candidate: ${{ steps.candidate.outcome }}; baseline: ${{ steps.baseline.outcome }}; candidate without directory flush: ${{ steps.nodirsync.outcome }}"
          [ "${{ steps.candidate.outcome }}" = success ]
