name: installer-smoke

# Release checklist, the part that needs no human eyes (docs/release-runbook.md
# "Automated"; audit F10 in docs/audit-gate1.md). Manual only: it installs the
# CI-built installers in Windows 11 and Windows 10 22H2 client VMs (Microsoft
# evaluation media, QEMU/KVM on a GitHub-hosted runner; the harness is the G6
# one, docs/g6-windows-crash-replay.md) and in the two Ubuntu LTS releases.
#
#   gh workflow run installer-smoke.yml --ref <branch>
#   gh workflow run installer-smoke.yml -f ci_run_id=<run of ci.yml whose `package` jobs built the installers>
#
# What it does NOT do, and the runbook keeps for the owner: anything that needs
# eyes or ears (Explorer's menu, screen readers, contrast themes), the updater
# (it needs two published releases), and a Windows 10/11 machine whose own
# updates, antivirus and SmartScreen are on. The Windows VM has no UAC prompt,
# Defender, or Windows Update; the runbook says so next to each automated item.
#
# Nothing is published, signed, or pushed. The installers are the unsigned CI builds.

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Use the installers from this ci.yml run (artifacts mochi-installer-nsis-unsigned and mochi-installer-deb-unsigned) instead of building them here"
        required: false
        default: ""
      windows_10:
        description: "Also run Windows 10 22H2 (evaluation ISO from Microsoft's download link; see docs/g6-windows-crash-replay.md)"
        type: boolean
        default: true
      remove_webview2:
        description: "In the Windows VM, uninstall the WebView2 runtime first (when present) so the installer's bootstrapper has to download it"
        type: boolean
        default: true
      ubuntu:
        description: "Also run the Ubuntu 22.04 and 24.04 .deb checks"
        type: boolean
        default: true
  # TEMPORARY, removed before review: a new workflow file cannot be dispatched from
  # a branch until it exists on the default branch, so the runs are by push.
  push:
    branches: [claude/release-runbook-f10]

concurrency:
  group: installer-smoke-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  static:
    # Cheap, and run first: the guest scripts only ever run inside a VM, so a typo
    # in one would otherwise cost an hour.
    name: static checks
    runs-on: ubuntu-24.04
    outputs:
      oses: ${{ steps.plan.outputs.oses }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_WINDOWS_10: ${{ inputs.windows_10 }}
        run: |
          if [ "$INPUT_WINDOWS_10" = false ]; then oses='["windows-11"]'; else oses='["windows-11","windows-10"]'; fi
          echo "oses=$oses" | tee -a "$GITHUB_OUTPUT"
      - name: Verdict logic and shell syntax
        run: |
          python3 -I ci/g6-windows/test_smoke.py
          python3 -I ci/g6-windows/test_evaluate.py
          bash -n packaging/smoke-deb-desktop.sh ci/g6-windows-crashreplay.sh
          shellcheck packaging/smoke-deb-desktop.sh
      - name: PowerShell guest scripts parse
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem ci/g6-windows/guest -Recurse -Filter *.ps1) {
            $errs = $null; $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            foreach ($e in $errs) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            $text = Get-Content $f.FullName -Raw
            if ($text -match '[^\x00-\x7F]') { Write-Host "::error file=$($f.FullName)::non-ASCII character (Windows PowerShell 5.1 reads a BOM-less file as ANSI)"; $bad++ }
          }
          if ($bad) { exit 1 }
          "guest scripts parse"

  build-nsis:
    name: Windows installer
    needs: static
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.ci_run_id != '' }}
        with:
          name: mochi-installer-nsis-unsigned
          path: installer
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: ${{ inputs.ci_run_id == '' }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.ci_run_id == '' }}
        with:
          key: package-windows-latest
      - uses: actions/setup-python@v5
        if: ${{ inputs.ci_run_id == '' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ inputs.ci_run_id == '' }}
        with:
          node-version: 24
      - name: Build the installer (the same steps as the `package` job in ci.yml)
        if: ${{ inputs.ci_run_id == '' }}
        shell: bash
        run: |
          corepack enable
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo install tauri-cli --version 2.12.2 --locked
          packaging/build-installer.sh nsis
          mkdir -p installer
          cp target/release/bundle/nsis/*-setup.exe installer/
      - name: What is being tested
        shell: bash
        run: |
          ls -l installer
          [ "$(ls installer/*-setup.exe | wc -l)" = 1 ]
          echo "ci_run_id=${{ inputs.ci_run_id }} sha=$GITHUB_SHA" > installer/SUBJECT.txt
          sha256sum installer/*-setup.exe | tee -a installer/SUBJECT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-setup-nsis
          path: installer/*
          if-no-files-found: error
          retention-days: 14

  build-deb:
    name: Ubuntu package
    needs: static
    if: ${{ format('{0}', inputs.ubuntu) != 'false' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ inputs.ci_run_id != '' }}
        with:
          name: mochi-installer-deb-unsigned
          path: installer
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Install pinned toolchain (rust-toolchain.toml)
        if: ${{ inputs.ci_run_id == '' }}
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: ${{ inputs.ci_run_id == '' }}
        with:
          key: package-ubuntu-22.04
      - uses: actions/setup-python@v5
        if: ${{ inputs.ci_run_id == '' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ inputs.ci_run_id == '' }}
        with:
          node-version: 24
      - name: Build the package (the same steps as the `package` job in ci.yml)
        if: ${{ inputs.ci_run_id == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
          corepack enable
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo install tauri-cli --version 2.12.2 --locked
          packaging/build-installer.sh deb
          mkdir -p installer
          cp target/release/bundle/deb/*.deb installer/
      - run: ls -l installer && [ "$(ls installer/*.deb | wc -l)" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-deb
          path: installer/*.deb
          if-no-files-found: error
          retention-days: 14

  ubuntu:
    name: .deb on ${{ matrix.os }}
    needs: build-deb
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-deb
          path: installer
      - name: Desktop test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-utils dbus-x11 dbus \
            desktop-file-utils libglib2.0-bin shared-mime-info xdg-utils file-roller
      - name: Install from a path, register, start from the launcher, open a hard path, remove
        run: packaging/smoke-deb-desktop.sh "$(ls installer/*.deb)" "$RUNNER_TEMP/deb-results.json"
      - name: Summary
        if: always()
        run: |
          {
            echo "## .deb on ${{ matrix.os }}"
            echo '| Check | Result | What was seen |'
            echo '|---|---|---|'
            python3 -I - "$RUNNER_TEMP/deb-results.json" <<'PY'
          import json, sys
          try:
              rows = json.load(open(sys.argv[1]))
          except OSError:
              rows = [{"id": "-", "status": "FAIL", "detail": "the script wrote no results"}]
          for r in rows:
              print(f"| `{r['id']}` | {r['status']} | {r['detail'].replace('|', '/')} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    # One runner per guest OS, in parallel. The image is built here from Microsoft's
    # evaluation ISO exactly as the G6 replay does (it is not cached; see the G6 doc).
    name: installer in ${{ matrix.os }}
    needs: [static, build-nsis]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.static.outputs.oses) }}
    env:
      G6_WORK: /var/tmp/g6
      G6_EVIDENCE: /var/tmp/g6/evidence
      G6_OS: ${{ matrix.os }}
      G6_SKIP_LOGWRITES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: smoke-setup-nsis
          path: installer
      - name: Free disk space
        run: bash ci/g6-windows-crashreplay.sh free-disk
      - name: Host setup (KVM, QEMU, OVMF, swtpm)
        run: bash ci/g6-windows-crashreplay.sh setup
      - name: Resolve the Microsoft evaluation ISO
        run: bash ci/g6-windows-crashreplay.sh iso-info
      - name: Download the evaluation ISO
        run: bash ci/g6-windows-crashreplay.sh iso
      - name: Unattended Windows install
        run: bash ci/g6-windows-crashreplay.sh image
      - name: Install, check, uninstall in the guest
        id: smoke
        run: |
          bash ci/g6-windows-crashreplay.sh smoke "${{ matrix.os }}" "$PWD/$(ls installer/*-setup.exe)" \
            --subject "$(tr '\n' ' ' < installer/SUBJECT.txt)" \
            ${{ format('{0}', inputs.remove_webview2) != 'false' && '--remove-webview2' || '' }}
      - name: Summary
        if: always()
        run: |
          sudo chmod -R a+rX /var/tmp/g6 || true
          f=/var/tmp/g6/evidence/${{ matrix.os }}/summary.md
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "## ${{ matrix.os }}: no summary was written (the guest never reported)" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence-${{ matrix.os }}
          path: |
            /var/tmp/g6/evidence
            /var/tmp/g6/evidence-image
            /var/tmp/g6/tools.json
            /var/tmp/g6/win.iso.json
            /var/tmp/g6/image/build-info.json
          if-no-files-found: warn
          retention-days: 90
