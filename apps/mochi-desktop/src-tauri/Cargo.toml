[package]
name = "mochi-desktop"
description = "The MOCHI desktop application (Tauri v2): thin commands over mochi-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mochi_desktop"
path = "src/lib.rs"

[[bin]]
name = "mochi-desktop"
path = "src/main.rs"

[features]
# Embeds the built UI (`../ui/dist`) in the binary, as `tauri build` does.
# Without it the app loads `devUrl` (the Vite dev server): `cargo build` and
# `cargo test` then need no built frontend. The E2E job enables it.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
mochi-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
ts-rs = "12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
